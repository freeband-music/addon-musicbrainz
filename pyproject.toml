[project]
name = "freeband-addon-musicbrainz"
version = "0.1.0"
description = "Freeband MusicBrainz metadata add-on"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["fastapi", "uvicorn", "httpx", "pydantic"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freeband_protocol", "freeband_common", "freeband_musicbrainz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
